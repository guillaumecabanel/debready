[general]
import = ["~/.current-theme.toml"]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 14

[window]
dimensions = { columns = 180, lines = 48 }
padding.x = 14
padding.y = 10
decorations = "Full"

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "On" }

[keyboard]
bindings = [
  { key = "F11", action = "ToggleFullscreen" },
  { key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
  # CSI-u, so tmux can tell Shift+Enter / Alt+Shift+Enter apart from a plain Enter
  # (pairs with `extended-keys-format csi-u` in ~/.config/tmux/tmux.conf).
  { key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
  { key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" },
]

# Every window opens a fresh, independent tmux session (auto-named 1, 2, 3...),
# pre-populated with the windows listed in ~/.config/tmux/windows.conf.
# The zsh -c wrapper is a rescue hatch: if tmux ever fails to start, you land in
# a normal interactive shell instead of a terminal that will not open.
[terminal]
shell = { program = "/bin/zsh", args = ["-c", "~/.config/tmux/session.sh || exec /bin/zsh"] }

[mouse]
hide_when_typing = true
