# Tokyo Night — pairs with ~/.config/alacritty/theme-dark.toml

set -g status-style "bg=default,fg=#a9b1d6"

set -g status-left "#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=default,nobold] "

set -g status-right "#[fg=#ff9e64]#{?client_prefix, ,}#[fg=#bb9af7]#{?pane_in_mode, ,}#[fg=#9ece6a]#{?window_zoomed_flag, ,}#[fg=#565f89] %H:%M  #[fg=#414868]#[fg=#a9b1d6,bg=#414868] #h #[fg=#414868,bg=default]"

set -g window-status-format         "#[fg=#565f89] #I #W  "
set -g window-status-current-format "#[fg=#24283b,bg=default]#[fg=#7aa2f7,bg=#24283b,bold]#I #W#[fg=#24283b,bg=default]"
set -g window-status-activity-style "fg=#e0af68"
set -g window-status-bell-style     "fg=#f7768e,bold"

set  -g pane-border-style        "fg=#292e42"
set  -g pane-active-border-style "fg=#7aa2f7"
set  -g pane-border-lines        single

set  -g message-style          "bg=#24283b,fg=#7aa2f7"
set  -g message-command-style  "bg=#24283b,fg=#7aa2f7"
set  -g mode-style             "bg=#7aa2f7,fg=#1a1b26"
set  -g copy-mode-match-style          "bg=#3d59a1,fg=#c0caf5"
set  -g copy-mode-current-match-style  "bg=#7aa2f7,fg=#1a1b26"
setw -g clock-mode-colour "#7aa2f7"
set  -g display-panes-colour        "#565f89"
set  -g display-panes-active-colour "#7aa2f7"
