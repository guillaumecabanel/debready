# Catppuccin Latte — pairs with ~/.config/alacritty/theme-light.toml

set -g status-style "bg=default,fg=#4c4f69"

set -g status-left "#[fg=#1e66f5,bg=default]#[fg=#eff1f5,bg=#1e66f5,bold] #S #[fg=#1e66f5,bg=default,nobold] "

set -g status-right "#[fg=#fe640b]#{?client_prefix, ,}#[fg=#8839ef]#{?pane_in_mode, ,}#[fg=#40a02b]#{?window_zoomed_flag, ,}#[fg=#8c8fa1] %H:%M  #[fg=#ccd0da]#[fg=#4c4f69,bg=#ccd0da] #h #[fg=#ccd0da,bg=default]"

set -g window-status-format         "#[fg=#8c8fa1] #I #W  "
set -g window-status-current-format "#[fg=#ccd0da,bg=default]#[fg=#1e66f5,bg=#ccd0da,bold]#I #W#[fg=#ccd0da,bg=default]"
set -g window-status-activity-style "fg=#df8e1d"
set -g window-status-bell-style     "fg=#d20f39,bold"

set  -g pane-border-style        "fg=#bcc0cc"
set  -g pane-active-border-style "fg=#1e66f5"
set  -g pane-border-lines        single

set  -g message-style          "bg=#ccd0da,fg=#1e66f5"
set  -g message-command-style  "bg=#ccd0da,fg=#1e66f5"
set  -g mode-style             "bg=#1e66f5,fg=#eff1f5"
set  -g copy-mode-match-style          "bg=#bcc0cc,fg=#4c4f69"
set  -g copy-mode-current-match-style  "bg=#1e66f5,fg=#eff1f5"
setw -g clock-mode-colour "#1e66f5"
set  -g display-panes-colour        "#8c8fa1"
set  -g display-panes-active-colour "#1e66f5"
