# ── debready tmux ────────────────────────────────────────────────────────────
# Behaviour and bindings live here. Colours live in theme-{dark,light}.conf,
# selected through ~/.current-tmux-theme.conf (repointed by theme-switcher.service),
# mirroring how ~/.current-theme.toml works for Alacritty.

# ── Prefix ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix  C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# ── General ──────────────────────────────────────────────────────────────────
# Alacritty launches tmux directly, so tmux no longer inherits SHELL=/bin/zsh;
# without this every pane would fall back to the passwd shell (/bin/bash).
set  -g default-shell /usr/bin/zsh
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set  -g mouse on
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g history-limit 50000
set -sg escape-time 10
set  -g focus-events on
set  -g set-clipboard on
set  -g allow-passthrough on
setw -g aggressive-resize on
# One session per Alacritty window: exiting the last pane must close the window,
# so keep the default (Omarchy sets this off).
set  -g detach-on-destroy on
set  -g extended-keys on
set  -g extended-keys-format csi-u
set  -g set-titles on
set  -g set-titles-string '#S · #W'
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

bind r source-file ~/.config/tmux/tmux.conf \; display-message "  tmux.conf reloaded"

# ── Copy mode (vi) ───────────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Panes ────────────────────────────────────────────────────────────────────
bind h split-window -v -c "#{pane_current_path}"   # horizontal divider → stacked
bind v split-window -h -c "#{pane_current_path}"   # vertical divider   → side by side
bind -n M-Enter   split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind x kill-pane
bind z resize-pane -Z

# GNOME owns Ctrl+Alt+arrows (workspace switching) → Alt+hjkl instead.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Windows ──────────────────────────────────────────────────────────────────
# The windows a fresh session starts with are listed in windows.conf, read by
# session.sh (which Alacritty runs in place of `tmux new-session`) — not here,
# because this file is sourced once per *server*, not once per session.
bind c new-window -c "#{pane_current_path}"
bind k kill-window
bind , command-prompt -I "#W" "rename-window -- '%%'"

bind -n M-Left    previous-window
bind -n M-Right   next-window
bind -n M-S-Left  swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# The French (AZERTY) number row is shifted, so Alt+<the key labelled 1> emits
# M-& and not M-1. Both are bound so either layout works.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n 'M-&' select-window -t 1
bind -n 'M-é' select-window -t 2
bind -n 'M-"' select-window -t 3
bind -n "M-'" select-window -t 4
bind -n 'M-(' select-window -t 5
bind -n 'M--' select-window -t 6
bind -n 'M-è' select-window -t 7
bind -n 'M-_' select-window -t 8
bind -n 'M-ç' select-window -t 9

# ── Timestamp ────────────────────────────────────────────────────────────────
# run-shell format-expands its argument, so #{pane_id} pins the insert to the
# pane the key was pressed in; sh does the $(date) substitution. send-keys -l
# writes into the pane's tty, so this types at the zsh prompt and inside an
# editor alike, rather than pasting.
bind T   run-shell 'tmux send-keys -t "#{pane_id}" -l $(date +%Y%m%d)'
bind M-t run-shell 'tmux send-keys -t "#{pane_id}" -l $(date +%Y%m%d-%H%M%S)'

# ── Sessions ─────────────────────────────────────────────────────────────────
bind C new-session -c "#{pane_current_path}"
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind K kill-session
bind s choose-tree -Zs
bind -n M-Up   switch-client -p
bind -n M-Down switch-client -n

# ── Status bar geometry (colours come from the theme file) ───────────────────
set -g status on
set -g status-position top
set -g status-justify  left
set -g status-interval 5
set -g status-left-length  40
set -g status-right-length 80
set -g window-status-separator ""

# ── Theme ────────────────────────────────────────────────────────────────────
# Falls back to dark if theme-switcher has not created the symlink yet.
if-shell '[ -e ~/.current-tmux-theme.conf ]' \
  'source-file ~/.current-tmux-theme.conf' \
  'source-file ~/.config/tmux/theme-dark.conf'
