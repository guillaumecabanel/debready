# Windows created in every fresh tmux session, in order.
#
#   <name>  <directory>
#
# The name is the first whitespace-separated field, the directory is the rest of
# the line (so paths may contain spaces). A leading ~ is expanded; a directory
# that does not exist falls back to $HOME. Blank lines and #-comments are ignored.
#
# Read by ~/.config/tmux/session.sh, which Alacritty runs instead of
# `tmux new-session`. No reload needed — the next window you open picks it up.
#
# This file is tracked in git, so keep it machine-neutral. Personal projects go in
# windows.local.conf beside it, whose lines are appended after these ones; that
# file is gitignored and survives boot.sh's `git reset --hard`.

home        ~
